name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Cleanup workspace
        run: |
          cd ${{ github.workspace }}
          git clean -ffdx || true
          git reset --hard || true
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go vet
        run: go vet ./...
      - name: Go build check
        run: go build ./...
      - name: Go test
        run: go test ./... || echo "no tests yet"
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Backup .env if exists
        run: |
          if [ -f ${{ github.workspace }}/.env ]; then
            cp ${{ github.workspace }}/.env /tmp/.env.backup
          fi
      - name: Cleanup workspace
        run: |
          cd ${{ github.workspace }}
          git clean -ffdx || true
          git reset --hard || true
      - name: Restore .env
        run: |
          if [ -f /tmp/.env.backup ]; then
            cp /tmp/.env.backup ${{ github.workspace }}/.env
            rm /tmp/.env.backup
          elif [ -f ${{ github.workspace }}/.env.example ]; then
            cp ${{ github.workspace }}/.env.example ${{ github.workspace }}/.env
          fi
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "⚠️ .env not found, creating from .env.example"
            cp .env.example .env
          fi
      - name: Build and deploy
        run: |
          docker compose -p infra-activity-log up -d --build
          docker image prune -f

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infra Activity Log</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">IAL</span>
      <span class="sidebar-title">Infra Activity Log</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="logs">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span class="nav-text">Activity Logs</span>
      </a>
      <div class="nav-section-label">Master Data</div>
      <a href="#" class="nav-item" data-page="master-job-titles">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        <span class="nav-text">Job Title</span>
      </a>
      <a href="#" class="nav-item" data-page="master-pics">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span class="nav-text">PIC</span>
      </a>
      <a href="#" class="nav-item" data-page="master-statuses">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="nav-text">Status</span>
      </a>
      <a href="#" class="nav-item" data-page="master-categories">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span class="nav-text">Category</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <header>
      <h1 id="pageTitle">Activity Logs</h1>
      <button id="btnAdd" class="btn btn-primary">+ Add Log</button>
    </header>

    <!-- Activity Logs Page -->
    <div id="page-logs" class="page active">
      <div class="filters">
        <input type="date" id="fDateFrom" title="From date">
        <input type="date" id="fDateTo" title="To date">
        <select id="fPic"><option value="">All PIC</option></select>
        <select id="fStatus"><option value="">All Status</option></select>
        <select id="fCategory"><option value="">All Category</option></select>
        <input type="text" id="fSearch" placeholder="Search label/application...">
        <button id="btnFilter" class="btn btn-primary">Filter</button>
        <button id="btnReset" class="btn btn-ghost">Reset</button>
      </div>
      <div class="table-wrap">
        <table id="logsTable">
          <thead>
            <tr>
              <th>Date</th><th>Job Title</th><th>PIC</th><th>Application</th>
              <th>Label</th><th>Old Value</th><th>Req New Value</th>
              <th>Status</th><th>Category</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="logsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Master Pages (rendered by master.js) -->
    <div id="page-master-job-titles" class="page"></div>
    <div id="page-master-pics" class="page"></div>
    <div id="page-master-statuses" class="page"></div>
    <div id="page-master-categories" class="page"></div>
  </div>
</div>

<!-- Log Modal (fixed, never overwritten) -->
<div id="logModal" class="modal hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Add Log</h2>
    <form id="logForm">
      <input type="hidden" id="logId">
      <div class="form-row">
        <label>Date <input type="date" id="fldTanggal" required></label>
        <label>Job Title <select id="fldJobTitle" required></select></label>
      </div>
      <div class="form-row">
        <label>PIC <select id="fldPic" required></select></label>
        <label>Application <input type="text" id="fldApplication" placeholder="e.g: Wialon Local"></label>
      </div>
      <label>Label <textarea id="fldLabel" required placeholder="Activity description"></textarea></label>
      <div class="form-row">
        <fieldset>
          <legend>Old Value</legend>
          <textarea id="fldOldValueText" placeholder="Old value text (optional)"></textarea>
          <input type="file" id="fldOldValueImage" accept="image/png,image/jpeg">
          <img id="oldPreview" class="preview hidden">
        </fieldset>
        <fieldset>
          <legend>Req New Value</legend>
          <textarea id="fldNewValueText" placeholder="New value text (optional)"></textarea>
          <input type="file" id="fldNewValueImage" accept="image/png,image/jpeg">
          <img id="newPreview" class="preview hidden">
        </fieldset>
      </div>
      <div class="form-row">
        <label>Status <select id="fldStatus" required></select></label>
        <label>Category <select id="fldCategory" required></select></label>
      </div>
      <div class="modal-actions">
        <button type="button" id="btnCancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Master Modal (used by master.js) -->
<div id="masterModal" class="modal hidden">
  <div class="modal-content" id="masterModalContent"></div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImg" src="">
</div>

<script src="/app.js"></script>
<script src="/master.js"></script>
</body>
</html>
